[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-chromosphere-velocity"
version = "2.1.0"
description = "CHASE/HIS chromospheric velocity processing: streaming, vectorised, multi-HDU"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Solar Physics Team" }]
keywords = ["solar physics", "chromosphere", "velocity", "CHASE", "HIS", "Halpha"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# v1 declared sunpy, fitsio, scikit-image, numba and tqdm.  sunpy was imported
# but never used, fitsio/skimage were never imported at all, and the batched
# inversion no longer needs numba or tqdm.
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "astropy>=5.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
dev = ["pytest>=7.0"]
all = ["matplotlib>=3.5", "pytest>=7.0"]

[project.scripts]
scv = "solar_chromosphere_velocity.cli:main"
process-chase = "solar_chromosphere_velocity.cli:main"

[project.urls]
Homepage = "https://github.com/niyw1997/solar-chromosphere-velocity"
Source = "https://github.com/niyw1997/solar-chromosphere-velocity"
Issues = "https://github.com/niyw1997/solar-chromosphere-velocity/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
