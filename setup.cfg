[metadata]
name = solar-chromosphere-velocity
version = attr: solar_chromosphere_velocity.__version__
author = Solar Physics Team
author_email = solar@example.com
description = Solar chromosphere velocity data processing package for CHASE mission
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/yourusername/solar-chromosphere-velocity
license = MIT
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Astronomy
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Operating System :: OS Independent

[options]
package_dir = = src
packages = find:
python_requires = >=3.8
install_requires =
    numpy>=1.21.0
    scipy>=1.7.0
    astropy>=5.0
    sunpy>=3.0
    matplotlib>=3.5.0
    scikit-image>=0.19.0
    tqdm>=4.64.0
    fitsio>=1.1.0
    numba>=0.56.0

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=7.0
    pytest-cov>=4.0
    black>=22.0
    flake8>=5.0
    mypy>=0.991
docs =
    sphinx>=5.0
    sphinx-rtd-theme>=1.0
    nbsphinx>=0.8.0

[options.entry_points]
console_scripts =
    process-chase = solar_chromosphere_velocity.cli:main

[flake8]
max-line-length = 88
extend-ignore = E203, W503

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True

[egg_info]
tag_build = 
tag_date = 0